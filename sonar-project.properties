sonar.projectKey=oaslananka_fovux-kit
sonar.organization=oaslananka
sonar.projectName=Fovux Kit
sonar.sourceEncoding=UTF-8

sonar.sources=fovux-mcp/src,fovux-studio/src,fovux-mcp-npm/bin
sonar.tests=fovux-mcp/tests,fovux-studio/test
sonar.test.inclusions=fovux-mcp/tests/**/*.py,fovux-studio/test/**/*.ts,fovux-studio/test/**/*.tsx

sonar.python.version=3.12,3.13,3.14
sonar.python.coverage.reportPaths=fovux-mcp/coverage.xml
sonar.javascript.lcov.reportPaths=fovux-studio/coverage/lcov.info

sonar.exclusions=**/node_modules/**,**/.venv/**,**/venv/**,**/dist/**,**/build/**,**/out/**,**/coverage/**,**/htmlcov/**,**/.vscode-test/**,**/*.min.js,**/*.map,**/package-lock.json,**/pnpm-lock.yaml,**/uv.lock,**/fixtures/**,reports/**,.scan-results/**,.scanner-cache/**,.semgrep/**
sonar.coverage.exclusions=**/tests/**,**/test/**,**/__main__.py,**/cli.py
sonar.cpd.exclusions=**/tests/**,**/test/**,**/fixtures/**,fovux-studio/src/fovux/tools/definitions.ts
