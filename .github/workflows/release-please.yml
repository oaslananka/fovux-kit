name: Release Please

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  release-please:
    name: release-please-main
    if: github.repository == 'oaslananka/fovux-kit' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    outputs:
      mcp_release_created: ${{ steps.rp.outputs['fovux-mcp--release_created'] }}
      mcp_tag_name: ${{ steps.rp.outputs['fovux-mcp--tag_name'] }}
      mcp_version: ${{ steps.rp.outputs['fovux-mcp--version'] }}
      mcp_npm_release_created: ${{ steps.rp.outputs['fovux-mcp-npm--release_created'] }}
      mcp_npm_tag_name: ${{ steps.rp.outputs['fovux-mcp-npm--tag_name'] }}
      mcp_npm_version: ${{ steps.rp.outputs['fovux-mcp-npm--version'] }}
      studio_release_created: ${{ steps.rp.outputs['fovux-studio--release_created'] }}
      studio_tag_name: ${{ steps.rp.outputs['fovux-studio--tag_name'] }}
      studio_version: ${{ steps.rp.outputs['fovux-studio--version'] }}

    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Synchronize release pull request metadata
        if: steps.rp.outputs.prs != '' && steps.rp.outputs.prs != '[]'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PULL_REQUESTS: ${{ steps.rp.outputs.prs }}
        run: |
          set -euo pipefail
          branches="$(
            jq -r '.[] | .headBranchName // .headRefName // .head_branch // empty' \
              <<<"$RELEASE_PULL_REQUESTS" | sort -u
          )"

          if [[ -z "$branches" ]]; then
            echo "No release pull request branches found."
            exit 0
          fi

          while IFS= read -r branch; do
            [[ -z "$branch" ]] && continue
            workdir="$(mktemp -d)"
            trap 'rm -rf "$workdir"' RETURN
            git clone --branch "$branch" --depth 1 \
              "https://github.com/${GITHUB_REPOSITORY}.git" "$workdir"
            cd "$workdir"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            python3 scripts/sync_mcp_metadata.py
            if git diff --quiet; then
              cd -
              rm -rf "$workdir"
              trap - RETURN
              continue
            fi
            git add mcp.json fovux-mcp/server.json fovux-mcp/smithery.yaml fovux-mcp/uv.lock \
              CHANGELOG.md RELEASE_NOTES.md docs/release-notes/
            git commit -m "chore(release): sync release metadata"
            git remote set-url origin \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin "HEAD:${branch}"
            cd -
            rm -rf "$workdir"
            trap - RETURN
          done <<<"$branches"

      - name: Dispatch release pull request checks
        if: steps.rp.outputs.prs != '' && steps.rp.outputs.prs != '[]'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PULL_REQUESTS: ${{ steps.rp.outputs.prs }}
        run: |
          set -euo pipefail
          declare -A workflow_contexts=(
            ["ci.yml"]="ci-required"
            ["security.yml"]="security-required"
            ["codeql.yml"]="codeql-required"
            ["scorecard.yml"]="scorecard-required"
            ["release-please.yml"]="release-please"
          )

          create_status() {
            local sha="$1"
            local state="$2"
            local context="$3"
            local description="$4"
            local target_url="${5:-}"

            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${sha}" \
              -f state="$state" \
              -f context="$context" \
              -f description="$description" \
              ${target_url:+-f target_url="$target_url"} >/dev/null
          }

          wait_for_workflow() {
            local branch="$1"
            local sha="$2"
            local workflow="$3"
            local context="$4"
            local run_id=""

            for _ in {1..60}; do
              run_id="$(
                gh run list \
                  --repo "$GITHUB_REPOSITORY" \
                  --workflow "$workflow" \
                  --branch "$branch" \
                  --json databaseId,headSha,createdAt \
                  --limit 20 \
                  | jq -r --arg sha "$sha" \
                    '[.[] | select(.headSha == $sha)] | sort_by(.createdAt) | reverse | .[0].databaseId // empty'
              )"
              if [[ -n "$run_id" ]]; then
                break
              fi
              sleep 5
            done

            if [[ -z "$run_id" ]]; then
              create_status "$sha" failure "$context" "No $workflow run was created for release PR checks."
              return 1
            fi

            while true; do
              run="$(
                gh run view "$run_id" \
                  --repo "$GITHUB_REPOSITORY" \
                  --json status,conclusion,url
              )"
              status="$(jq -r '.status' <<<"$run")"
              conclusion="$(jq -r '.conclusion // empty' <<<"$run")"
              url="$(jq -r '.url' <<<"$run")"

              if [[ "$status" == "completed" ]]; then
                if [[ "$conclusion" == "success" ]]; then
                  create_status "$sha" success "$context" "$workflow completed successfully." "$url"
                  return 0
                fi
                create_status "$sha" failure "$context" "$workflow concluded ${conclusion:-unknown}." "$url"
                return 1
              fi

              sleep 10
            done
          }

          branches="$(
            jq -r '.[] | .headBranchName // .headRefName // .head_branch // empty' \
              <<<"$RELEASE_PULL_REQUESTS" | sort -u
          )"

          if [[ -z "$branches" ]]; then
            echo "No release pull request branches found."
            exit 0
          fi

          while IFS= read -r branch; do
            [[ -z "$branch" ]] && continue
            head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${branch}" --jq '.sha')"
            for workflow in "${!workflow_contexts[@]}"; do
              context="${workflow_contexts[$workflow]}"
              create_status "$head_sha" pending "$context" "$workflow release PR check is queued."
              gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref "$branch"
            done
            for workflow in "${!workflow_contexts[@]}"; do
              wait_for_workflow "$branch" "$head_sha" "$workflow" "${workflow_contexts[$workflow]}"
            done
          done <<<"$branches"

  release-please-check:
    name: release-please
    if: >
      github.repository == 'oaslananka/fovux-kit' &&
      github.event_name != 'push' &&
      (
        github.event_name != 'pull_request' ||
        github.event.pull_request.draft == false
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Validate release automation
        run: |
          set -euo pipefail
          node scripts/validate_release_automation.mjs

  publish-mcp:
    needs: release-please
    if: >
      needs.release-please.outputs.mcp_release_created == 'true' &&
      github.repository == 'oaslananka/fovux-kit'
    runs-on: ubuntu-24.04
    environment: pypi-production
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.release-please.outputs.mcp_tag_name }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

      - name: Build Python package
        working-directory: fovux-mcp
        env:
          PACKAGE_VERSION: ${{ needs.release-please.outputs.mcp_version }}
        run: |
          set -euo pipefail
          actual_version="$(
            uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          )"
          test "$actual_version" = "$PACKAGE_VERSION"
          uv build

      - name: Generate SBOM and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          uv run --project fovux-mcp python scripts/build_spdx_sbom.py \
            --name fovux-mcp \
            --output fovux-mcp-sbom.spdx.json
          python scripts/generate_security_posture.py
          sha256sum fovux-mcp/dist/* fovux-mcp-sbom.spdx.json docs/security-posture.md > fovux-mcp.sha256

      - name: Attest Python release assets
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
        with:
          subject-checksums: fovux-mcp.sha256

      - name: Attach Python release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-please.outputs.mcp_tag_name }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" --clobber \
            fovux-mcp/dist/* \
            fovux-mcp-sbom.spdx.json \
            docs/security-posture.md \
            fovux-mcp.sha256

      - name: Publish Python package
        working-directory: fovux-mcp
        env:
          PYPI_TRUSTED_PUBLISHING_ENABLED: ${{ vars.PYPI_TRUSTED_PUBLISHING_ENABLED }}
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$PYPI_TRUSTED_PUBLISHING_ENABLED" == "true" ]]; then
            uv publish dist/*
          elif [[ -n "${PYPI_TOKEN:-}" ]]; then
            uv publish --token "$PYPI_TOKEN" dist/*
          else
            echo "::error::PyPI trusted publishing or PYPI_TOKEN is required for a release."
            exit 1
          fi

      - name: Verify Python release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-please.outputs.mcp_tag_name }}
          PACKAGE_VERSION: ${{ needs.release-please.outputs.mcp_version }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          for attempt in {1..20}; do
            published="$(
              curl -fsSL --retry 3 "https://pypi.org/pypi/fovux-mcp/json" \
                | jq -r '.info.version' 2>/dev/null || true
            )"
            if [[ "$published" == "$PACKAGE_VERSION" ]]; then
              exit 0
            fi
            echo "Waiting for PyPI fovux-mcp $PACKAGE_VERSION to become visible (attempt $attempt/20)."
            sleep 10
          done
          echo "::error::PyPI fovux-mcp $PACKAGE_VERSION was not visible after publish."
          exit 1

  publish-npm-wrapper:
    needs: release-please
    if: >
      needs.release-please.outputs.mcp_npm_release_created == 'true' &&
      github.repository == 'oaslananka/fovux-kit'
    runs-on: ubuntu-24.04
    environment: npm-production
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.release-please.outputs.mcp_npm_tag_name }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .nvmrc
          registry-url: "https://registry.npmjs.org"
          cache: ""

      - name: Verify npm wrapper package
        working-directory: fovux-mcp-npm
        env:
          PACKAGE_VERSION: ${{ needs.release-please.outputs.mcp_npm_version }}
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').name")" = "fovux-mcp"
          test "$(node -p "require('./package.json').version")" = "$PACKAGE_VERSION"
          test "$(node -p "require('./package.json').bin['fovux-mcp']")" = "bin/fovux-mcp.js"
          npm pack --dry-run

      - name: Publish npm wrapper
        working-directory: fovux-mcp-npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npm publish --provenance --access public

      - name: Verify npm wrapper release
        env:
          PACKAGE_VERSION: ${{ needs.release-please.outputs.mcp_npm_version }}
        run: |
          set -euo pipefail
          for attempt in {1..20}; do
            published="$(npm view fovux-mcp version --json 2>/dev/null | tr -d '"' || true)"
            if [[ "$published" == "$PACKAGE_VERSION" ]]; then
              exit 0
            fi
            echo "Waiting for npm fovux-mcp $PACKAGE_VERSION to become visible (attempt $attempt/20)."
            sleep 10
          done
          echo "::error::npm fovux-mcp $PACKAGE_VERSION was not visible after publish."
          exit 1

  publish-studio:
    needs: release-please
    if: >
      needs.release-please.outputs.studio_release_created == 'true' &&
      github.repository == 'oaslananka/fovux-kit'
    runs-on: ubuntu-24.04
    environment: vsce-production
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.release-please.outputs.studio_tag_name }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"

      - name: Build VSIX
        working-directory: fovux-studio
        env:
          PACKAGE_VERSION: ${{ needs.release-please.outputs.studio_version }}
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.34.1 --activate
          pnpm install --frozen-lockfile
          pnpm build
          test "$(node -p "require('./package.json').publisher + '.' + require('./package.json').name")" = "oaslananka.fovuxstudiokit"
          test "$(node -p "require('./package.json').displayName")" = "Fovux Studio Kit"
          test "$(node -p "require('./package.json').version")" = "$PACKAGE_VERSION"
          node ../scripts/package_vscode_extension.mjs --extension-dir . --out fovuxstudiokit.vsix

      - name: Generate SBOM and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/build_node_spdx_sbom.mjs \
            --package fovux-studio/package.json \
            --output fovux-studio-sbom.spdx.json
          python scripts/generate_security_posture.py
          sha256sum fovux-studio/fovuxstudiokit.vsix fovux-studio-sbom.spdx.json docs/security-posture.md > fovux-studio.sha256

      - name: Attest Studio release assets
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
        with:
          subject-checksums: fovux-studio.sha256

      - name: Attach Studio release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-please.outputs.studio_tag_name }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" --clobber \
            fovux-studio/fovuxstudiokit.vsix \
            fovux-studio-sbom.spdx.json \
            docs/security-posture.md \
            fovux-studio.sha256

      - name: Publish Studio extension
        working-directory: fovux-studio
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          if [[ -z "${VSCE_PAT:-}" ]]; then
            echo "::error::VSCE_PAT is required for a Studio release."
            exit 1
          fi
          if [[ -z "${OVSX_PAT:-}" ]]; then
            echo "::error::OVSX_PAT is required for a Studio release."
            exit 1
          fi
          publish_status=0

          node ../scripts/publish_vscode_extension.mjs marketplace \
            --vsix fovuxstudiokit.vsix \
            --publisher oaslananka \
            --name fovuxstudiokit \
            --version "${{ needs.release-please.outputs.studio_version }}" || publish_status=1

          node ../scripts/publish_vscode_extension.mjs open-vsx \
            --vsix fovuxstudiokit.vsix \
            --publisher oaslananka \
            --name fovuxstudiokit \
            --version "${{ needs.release-please.outputs.studio_version }}" || publish_status=1

          exit "$publish_status"

      - name: Verify Studio release
        working-directory: fovux-studio
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-please.outputs.studio_tag_name }}
          PACKAGE_VERSION: ${{ needs.release-please.outputs.studio_version }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          node ../scripts/publish_vscode_extension.mjs marketplace \
            --vsix fovuxstudiokit.vsix \
            --publisher oaslananka \
            --name fovuxstudiokit \
            --version "$PACKAGE_VERSION"
          node ../scripts/publish_vscode_extension.mjs open-vsx \
            --vsix fovuxstudiokit.vsix \
            --publisher oaslananka \
            --name fovuxstudiokit \
            --version "$PACKAGE_VERSION"

  verify-release:
    name: Verify Release
    needs:
      - release-please
      - publish-mcp
      - publish-npm-wrapper
      - publish-studio
    if: >
      always() &&
      github.repository == 'oaslananka/fovux-kit' &&
      (
        needs.release-please.outputs.mcp_release_created == 'true' ||
        needs.release-please.outputs.mcp_npm_release_created == 'true' ||
        needs.release-please.outputs.studio_release_created == 'true'
      ) &&
      (
        needs.publish-mcp.result == 'success' ||
        needs.publish-mcp.result == 'skipped'
      ) &&
      (
        needs.publish-npm-wrapper.result == 'success' ||
        needs.publish-npm-wrapper.result == 'skipped'
      ) &&
      (
        needs.publish-studio.result == 'success' ||
        needs.publish-studio.result == 'skipped'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      - name: Verify release packages are live and functional
        run: |
          set -euo pipefail
          if [[ "${{ needs.release-please.outputs.mcp_release_created }}" == "true" ]]; then
            python scripts/verify_registry_releases.py \
              --channel python --retries 20 --delay 15 \
              --evidence-path out/registry-verification-python.json
          fi
          if [[ "${{ needs.release-please.outputs.mcp_npm_release_created }}" == "true" ]]; then
            python scripts/verify_registry_releases.py \
              --channel npm --retries 20 --delay 15 \
              --evidence-path out/registry-verification-npm.json
          fi
          if [[ "${{ needs.release-please.outputs.studio_release_created }}" == "true" ]]; then
            python scripts/verify_registry_releases.py \
              --channel studio --retries 20 --delay 15 \
              --evidence-path out/registry-verification-studio.json
          fi
      - name: Upload registry verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: registry-verification-${{ github.event.repository.name }}
          path: out/registry-verification-*.json
          if-no-files-found: ignore
