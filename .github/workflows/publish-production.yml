name: Publish Production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA to publish
        required: true
      channel:
        description: Registry channel to publish
        required: true
        default: studio
        type: choice
        options:
          - studio
          - pypi
          - mcp-registry
          - all
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.16.0"
  PUBLISH_NODE_VERSION: "22"
  MCP_PUBLISHER_VERSION: "1.7.9"
  PYPI_DIRECTORY: "fovux-mcp"
  VSCODE_DIRECTORY: "fovux-studio"

defaults:
  run:
    shell: bash

concurrency:
  group: publish-production-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  build-python:
    if: >
      github.repository == 'oaslananka/fovux-kit' &&
      contains(fromJSON('["all","pypi","mcp-registry"]'), inputs.channel)
    outputs:
      publish_ref: ${{ steps.ref.outputs.value }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Resolve publish ref
        id: ref
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          ref="${INPUT_REF:-${GITHUB_SHA}}"
          if [[ ! "${ref}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "INVALID_PUBLISH_REF" >&2
            echo "Publish ref must resolve to a 40-character commit SHA." >&2
            exit 1
          fi
          echo "value=${ref}" >> "${GITHUB_OUTPUT}"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ steps.ref.outputs.value }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify publish ref is on release channel
        env:
          PUBLISH_REF: ${{ steps.ref.outputs.value }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin main
          if ! git merge-base --is-ancestor "${PUBLISH_REF}" origin/main; then
            echo "PUBLISH_REF_NOT_ON_RELEASE_CHANNEL" >&2
            echo "Ref must be reachable from origin/main." >&2
            exit 1
          fi
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"
      - name: Build Python distributions
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build
          cd "${PYPI_DIRECTORY}"
          python -m build
          test -d dist
          ls -l dist
      - name: Upload Python distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: python-distributions
          path: fovux-mcp/dist/*
          if-no-files-found: error

  pypi-publish:
    if: >
      github.repository == 'oaslananka/fovux-kit' &&
      contains(fromJSON('["all","pypi","mcp-registry"]'), inputs.channel)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build-python
    environment: pypi-production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: python-distributions
          path: dist
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"
      - name: Publish to PyPI
        id: publish
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m pip install --upgrade --disable-pip-version-check twine==6.2.0
          python -m twine check dist/*
          api_token="$(python - <<'PY'
          import json
          import os
          import urllib.request

          request = urllib.request.Request(
              os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=pypi",
              headers={
                  "Authorization": f"bearer {os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}"
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              oidc_token = json.load(response)["value"]

          mint_request = urllib.request.Request(
              "https://pypi.org/_/oidc/mint-token",
              data=json.dumps({"token": oidc_token}).encode(),
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(mint_request, timeout=30) as response:
              print(json.load(response)["token"])
          PY
          )"
          echo "::add-mask::${api_token}"
          TWINE_USERNAME="__token__" TWINE_PASSWORD="${api_token}" python -m twine upload --non-interactive dist/*
      - name: Write PyPI publish report
        if: always()
        env:
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          set -euo pipefail
          mkdir -p out
          if [[ "${PUBLISH_OUTCOME}" == "success" ]]; then
            state="published"
            result="fresh_publish_success"
            blocker=""
          else
            state="failed"
            result="external_blocker"
            blocker="PYPI_TRUSTED_PUBLISHING_NOT_CONFIGURED"
          fi
          REPORT_STATE="${state}" REPORT_RESULT="${result}" REPORT_BLOCKER="${blocker}" node -e 'const fs=require("fs"); fs.writeFileSync("out/publish-report-pypi.json", JSON.stringify({channel:"pypi",state:process.env.REPORT_STATE,result:process.env.REPORT_RESULT,blocker:process.env.REPORT_BLOCKER,package:"",version:"",run_url:process.env.GITHUB_SERVER_URL+"/"+process.env.GITHUB_REPOSITORY+"/actions/runs/"+process.env.GITHUB_RUN_ID,evidence:[]}, null, 2)+"\n")'
          if [[ "${PUBLISH_OUTCOME}" != "success" ]]; then
            echo "PYPI_TRUSTED_PUBLISHING_NOT_CONFIGURED" >&2
            exit 1
          fi
      - name: Upload PyPI publish report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: publish-report-${{ github.event.repository.name }}-pypi
          path: out/publish-report-pypi.json
          if-no-files-found: ignore

  mcp-registry-publish:
    if: >
      github.repository == 'oaslananka/fovux-kit' &&
      contains(fromJSON('["all","mcp-registry"]'), inputs.channel)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    needs:
      - build-python
      - pypi-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.build-python.outputs.publish_ref }}
          persist-credentials: false
      - name: Verify server metadata
        run: |
          mkdir -p out
          if [[ ! -f "${PYPI_DIRECTORY}/server.json" ]]; then
            echo "MCP_REGISTRY_CONFIG_MISSING"
            node -e 'const fs=require("fs"); fs.writeFileSync("out/publish-report-mcp-registry.json", JSON.stringify({channel:"mcp_registry",state:"failed",result:"external_blocker",blocker:"MCP_REGISTRY_CONFIG_MISSING",package:"",version:"",run_url:process.env.GITHUB_SERVER_URL+"/"+process.env.GITHUB_REPOSITORY+"/actions/runs/"+process.env.GITHUB_RUN_ID,evidence:["server.json missing in fovux-mcp"]}, null, 2)+"\n")'
            exit 1
          fi
      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          asset="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}"
          tmp="$(mktemp -d)"
          curl -fsSL "${base_url}/${asset}" -o "${tmp}/${asset}"
          curl -fsSL "${base_url}/registry_${MCP_PUBLISHER_VERSION}_checksums.txt" -o "${tmp}/checksums.txt"
          grep "  ${asset}$" "${tmp}/checksums.txt" > "${tmp}/checksums.filtered"
          (cd "${tmp}" && sha256sum -c checksums.filtered)
          tar -xzf "${tmp}/${asset}" -C "${tmp}" mcp-publisher
          sudo install -m 0755 "${tmp}/mcp-publisher" /usr/local/bin/mcp-publisher
      - name: Login via GitHub OIDC
        run: mcp-publisher login github-oidc
      - name: Validate server.json
        run: |
          set +e
          output="$(cd "${PYPI_DIRECTORY}" && mcp-publisher publish --dry-run 2>&1)"
          status="$?"
          set -e
          printf '%s\n' "${output}"
          if [[ "${status}" -eq 0 ]]; then
            exit 0
          fi
          node -e 'const fs=require("fs"); fs.writeFileSync("out/publish-report-mcp-registry.json", JSON.stringify({channel:"mcp_registry",state:"failed",result:"external_blocker",blocker:"MCP_REGISTRY_EXTERNAL_CONFIGURATION_REQUIRED",package:"",version:"",run_url:process.env.GITHUB_SERVER_URL+"/"+process.env.GITHUB_REPOSITORY+"/actions/runs/"+process.env.GITHUB_RUN_ID,evidence:["mcp-publisher dry-run failed"]}, null, 2)+"\n")'
          exit "${status}"
      - name: Publish to MCP Registry
        run: |
          set +e
          output="$(cd "${PYPI_DIRECTORY}" && mcp-publisher publish 2>&1)"
          status="$?"
          set -e
          printf '%s\n' "${output}"
          if [[ "${status}" -eq 0 ]]; then
            node -e 'const fs=require("fs"); fs.writeFileSync("out/publish-report-mcp-registry.json", JSON.stringify({channel:"mcp_registry",state:"published",result:"fresh_publish_success",blocker:"",package:"",version:"",run_url:process.env.GITHUB_SERVER_URL+"/"+process.env.GITHUB_REPOSITORY+"/actions/runs/"+process.env.GITHUB_RUN_ID,evidence:["mcp-publisher publish exited 0"]}, null, 2)+"\n")'
            exit 0
          fi
          node -e 'const fs=require("fs"); fs.writeFileSync("out/publish-report-mcp-registry.json", JSON.stringify({channel:"mcp_registry",state:"failed",result:"external_blocker",blocker:"MCP_REGISTRY_EXTERNAL_CONFIGURATION_REQUIRED",package:"",version:"",run_url:process.env.GITHUB_SERVER_URL+"/"+process.env.GITHUB_REPOSITORY+"/actions/runs/"+process.env.GITHUB_RUN_ID,evidence:["mcp-publisher publish failed"]}, null, 2)+"\n")'
          exit "${status}"
      - name: Upload MCP Registry publish report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: publish-report-${{ github.event.repository.name }}-mcp-registry
          path: out/publish-report-mcp-registry.json
          if-no-files-found: ignore

  package-extension:
    if: >
      github.repository == 'oaslananka/fovux-kit' &&
      contains(fromJSON('["all","studio"]'), inputs.channel)
    outputs:
      publish_ref: ${{ steps.ref.outputs.value }}
      package_name: ${{ steps.meta.outputs.name }}
      package_version: ${{ steps.meta.outputs.version }}
      extension_identifier: ${{ steps.meta.outputs.identifier }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Resolve publish ref
        id: ref
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          ref="${INPUT_REF:-${GITHUB_SHA}}"
          if [[ ! "${ref}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "INVALID_PUBLISH_REF" >&2
            echo "Publish ref must resolve to a 40-character commit SHA." >&2
            exit 1
          fi
          echo "value=${ref}" >> "${GITHUB_OUTPUT}"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ steps.ref.outputs.value }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify publish ref is on release channel
        env:
          PUBLISH_REF: ${{ steps.ref.outputs.value }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin main
          if ! git merge-base --is-ancestor "${PUBLISH_REF}" origin/main; then
            echo "PUBLISH_REF_NOT_ON_RELEASE_CHANNEL" >&2
            echo "Ref must be reachable from origin/main." >&2
            exit 1
          fi
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.PUBLISH_NODE_VERSION }}
          cache: ""
      - name: Install dependencies
        run: |
          set -euo pipefail
          cd "${VSCODE_DIRECTORY}"
          corepack enable
          corepack install
          corepack pnpm install --frozen-lockfile
      - name: Build extension
        run: |
          set -euo pipefail
          cd "${VSCODE_DIRECTORY}"
          corepack pnpm run --if-present build
      - name: Validate extension manifest
        id: meta
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("fs");
          const dir = process.env.VSCODE_DIRECTORY;
          const p = JSON.parse(fs.readFileSync(`${dir}/package.json`, "utf8"));
          for (const key of ["publisher", "name", "version"]) {
            if (!p[key]) throw new Error(`EXTENSION_MANIFEST_INVALID ${key}`);
          }
          const identifier = `${p.publisher}.${p.name}`;
          if (identifier !== "oaslananka.fovuxstudiokit") throw new Error(`EXTENSION_IDENTIFIER_INVALID ${identifier}`);
          if (p.displayName !== "Fovux Studio Kit") throw new Error(`EXTENSION_DISPLAY_NAME_INVALID ${p.displayName}`);
          if (!p.engines?.vscode) throw new Error("EXTENSION_MANIFEST_INVALID engines.vscode");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `name=${p.name}\nversion=${p.version}\nidentifier=${identifier}\n`);
          NODE
      - name: Package VSIX
        run: |
          set -euo pipefail
          mkdir -p "${VSCODE_DIRECTORY}/out"
          package_name="${{ steps.meta.outputs.name }}"
          node scripts/package_vscode_extension.mjs \
            --extension-dir "${VSCODE_DIRECTORY}" \
            --out "${VSCODE_DIRECTORY}/out/${package_name}.vsix"
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vscode-extension-package
          path: fovux-studio/out/*.vsix
          if-no-files-found: error

  studio-release-assets:
    if: >
      github.repository == 'oaslananka/fovux-kit' &&
      contains(fromJSON('["all","studio"]'), inputs.channel)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: package-extension
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.package-extension.outputs.publish_ref }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ""
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: vscode-extension-package
          path: fovux-studio/out
      - name: Generate Studio release assets
        run: |
          set -euo pipefail
          node scripts/build_node_spdx_sbom.mjs \
            --package fovux-studio/package.json \
            --output fovux-studio-sbom.spdx.json
          sha256sum fovux-studio/out/*.vsix fovux-studio-sbom.spdx.json > fovux-studio.sha256
      - name: Attest Studio release assets
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
        with:
          subject-checksums: fovux-studio.sha256
      - name: Upload Studio release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_tag="fovux-studio-v${{ needs.package-extension.outputs.package_version }}"
          gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$release_tag" --clobber \
            fovux-studio/out/*.vsix \
            fovux-studio-sbom.spdx.json \
            fovux-studio.sha256

  vscode-marketplace:
    if: >
      github.repository == 'oaslananka/fovux-kit' &&
      contains(fromJSON('["all","studio"]'), inputs.channel)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: package-extension
    environment: vsce-production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.package-extension.outputs.publish_ref }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.PUBLISH_NODE_VERSION }}
          cache: ""
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: vscode-extension-package
          path: out
      - name: Publish VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VS_MARKETPLACE_TOKEN: ${{ secrets.VS_MARKETPLACE_TOKEN }}
        run: |
          set -euo pipefail
          package_name="${{ needs.package-extension.outputs.package_name }}"
          package_version="${{ needs.package-extension.outputs.package_version }}"
          extension_identifier="${{ needs.package-extension.outputs.extension_identifier }}"
          write_report() {
            local state="$1"
            local result="$2"
            local blocker="$3"
            REPORT_CHANNEL="vscode_marketplace" \
            REPORT_STATE="${state}" \
            REPORT_RESULT="${result}" \
            REPORT_BLOCKER="${blocker}" \
            REPORT_PACKAGE="${package_name}" \
            REPORT_VERSION="${package_version}" \
            REPORT_IDENTIFIER="${extension_identifier}" \
            REPORT_PATH="out/publish-report-vscode-marketplace.json" \
            node <<'NODE'
          const fs = require("fs");
          const report = {
            channel: process.env.REPORT_CHANNEL,
            state: process.env.REPORT_STATE,
            result: process.env.REPORT_RESULT,
            blocker: process.env.REPORT_BLOCKER,
            package: process.env.REPORT_PACKAGE,
            version: process.env.REPORT_VERSION,
            identifier: process.env.REPORT_IDENTIFIER,
            run_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            evidence: [],
          };
          fs.writeFileSync(process.env.REPORT_PATH, `${JSON.stringify(report, null, 2)}\n`);
          NODE
          }
          token="${VSCE_PAT:-${VS_MARKETPLACE_TOKEN:-}}"
          if [[ -z "${token}" ]]; then echo "MARKETPLACE_SECRET_MISSING"; write_report "failed" "external_blocker" "MARKETPLACE_SECRET_MISSING"; exit 1; fi
          vsix="$(find out -maxdepth 1 -type f -name '*.vsix' -print -quit)"
          if [[ -z "${vsix}" ]]; then echo "EXTENSION_PACKAGE_MISSING"; write_report "failed" "workflow_failure" "EXTENSION_PACKAGE_MISSING"; exit 1; fi
          node scripts/publish_vscode_extension.mjs marketplace \
            --vsix "${vsix}" \
            --publisher "oaslananka" \
            --name "${package_name}" \
            --version "${package_version}" \
            --report-path "out/publish-report-vscode-marketplace.json"
      - name: Upload VS Code Marketplace publish report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: publish-report-${{ github.event.repository.name }}-vscode-marketplace
          path: out/publish-report-vscode-marketplace.json
          if-no-files-found: ignore

  open-vsx:
    if: >
      github.repository == 'oaslananka/fovux-kit' &&
      contains(fromJSON('["all","studio"]'), inputs.channel)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: package-extension
    environment: vsce-production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.package-extension.outputs.publish_ref }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.PUBLISH_NODE_VERSION }}
          cache: ""
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: vscode-extension-package
          path: out
      - name: Publish Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
        run: |
          set -euo pipefail
          package_name="${{ needs.package-extension.outputs.package_name }}"
          package_version="${{ needs.package-extension.outputs.package_version }}"
          extension_identifier="${{ needs.package-extension.outputs.extension_identifier }}"
          write_report() {
            local state="$1"
            local result="$2"
            local blocker="$3"
            REPORT_CHANNEL="open_vsx" \
            REPORT_STATE="${state}" \
            REPORT_RESULT="${result}" \
            REPORT_BLOCKER="${blocker}" \
            REPORT_PACKAGE="${package_name}" \
            REPORT_VERSION="${package_version}" \
            REPORT_IDENTIFIER="${extension_identifier}" \
            REPORT_PATH="out/publish-report-open-vsx.json" \
            node <<'NODE'
          const fs = require("fs");
          const report = {
            channel: process.env.REPORT_CHANNEL,
            state: process.env.REPORT_STATE,
            result: process.env.REPORT_RESULT,
            blocker: process.env.REPORT_BLOCKER,
            package: process.env.REPORT_PACKAGE,
            version: process.env.REPORT_VERSION,
            identifier: process.env.REPORT_IDENTIFIER,
            run_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            evidence: [],
          };
          fs.writeFileSync(process.env.REPORT_PATH, `${JSON.stringify(report, null, 2)}\n`);
          NODE
          }
          token="${OVSX_PAT:-${OPEN_VSX_TOKEN:-}}"
          if [[ -z "${token}" ]]; then echo "OPEN_VSX_SECRET_MISSING"; write_report "failed" "external_blocker" "OPEN_VSX_SECRET_MISSING"; exit 1; fi
          vsix="$(find out -maxdepth 1 -type f -name '*.vsix' -print -quit)"
          if [[ -z "${vsix}" ]]; then echo "EXTENSION_PACKAGE_MISSING"; write_report "failed" "workflow_failure" "EXTENSION_PACKAGE_MISSING"; exit 1; fi
          node scripts/publish_vscode_extension.mjs open-vsx \
            --vsix "${vsix}" \
            --publisher "oaslananka" \
            --name "${package_name}" \
            --version "${package_version}" \
            --report-path "out/publish-report-open-vsx.json"
      - name: Upload Open VSX publish report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: publish-report-${{ github.event.repository.name }}-open-vsx
          path: out/publish-report-open-vsx.json
          if-no-files-found: ignore

  verify-release:
    name: Verify Release
    needs:
      - pypi-publish
      - mcp-registry-publish
      - vscode-marketplace
      - open-vsx
    if: >
      always() &&
      github.repository == 'oaslananka/fovux-kit' &&
      (
        needs.pypi-publish.result == 'success' ||
        needs.pypi-publish.result == 'skipped'
      ) &&
      (
        needs.mcp-registry-publish.result == 'success' ||
        needs.mcp-registry-publish.result == 'skipped'
      ) &&
      (
        needs.vscode-marketplace.result == 'success' ||
        needs.vscode-marketplace.result == 'skipped'
      ) &&
      (
        needs.open-vsx.result == 'success' ||
        needs.open-vsx.result == 'skipped'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"
      - name: Verify release packages are live and functional
        run: |
          set -euo pipefail
          channel="${{ inputs.channel }}"
          if [[ "${channel}" == "all" ]]; then
            python scripts/verify_registry_releases.py \
              --channel all --retries 20 --delay 15
          elif [[ "${channel}" == "pypi" || "${channel}" == "mcp-registry" ]]; then
            python scripts/verify_registry_releases.py \
              --channel python --retries 20 --delay 15
          elif [[ "${channel}" == "studio" ]]; then
            python scripts/verify_registry_releases.py \
              --channel studio --retries 20 --delay 15
          fi
