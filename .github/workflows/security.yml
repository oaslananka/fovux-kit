name: Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 4"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  gitleaks:
    name: Gitleaks secret scan
    if: >
      github.repository == 'oaslananka/fovux-kit' &&
      (
        github.event_name != 'pull_request' ||
        github.event.pull_request.draft == false
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" gitleaks
          chmod 0755 "${RUNNER_TEMP}/gitleaks"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - name: Gitleaks scan
        run: gitleaks detect --no-banner --redact

  semgrep:
    permissions:
      contents: read
      security-events: write
    name: Semgrep SAST
    if: >
      github.repository == 'oaslananka/fovux-kit' &&
      (
        github.event_name != 'pull_request' ||
        github.event.pull_request.draft == false
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true
      - name: Install pinned Semgrep
        run: uv tool install --no-build semgrep==1.170.0
      - name: Validate Semgrep rules and fixtures
        run: |
          set -euo pipefail
          semgrep validate .semgrep/rules
          semgrep test .semgrep/rules
      - name: Run Semgrep SAST
        run: |
          set -euo pipefail
          semgrep scan \
            --config .semgrep/rules \
            --metrics=off \
            --error \
            --sarif-output semgrep-results.sarif \
            fovux-mcp/src \
            fovux-studio/src \
            fovux-mcp-npm/bin
      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@68bde559dea0fdcac2102bfdf6230c5f70eb485e
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep-fovux

  trivy-fs:
    permissions:
      contents: read
      security-events: write
    name: Trivy filesystem scan
    if: >
      github.repository == 'oaslananka/fovux-kit' &&
      (
        github.event_name != 'pull_request' ||
        github.event.pull_request.draft == false
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Run Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: sarif
          output: trivy-results.sarif
          exit-code: "1"
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@68bde559dea0fdcac2102bfdf6230c5f70eb485e
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

  pip-audit:
    name: pip-audit (fovux-mcp)
    if: >
      github.repository == 'oaslananka/fovux-kit' &&
      (
        github.event_name != 'pull_request' ||
        github.event.pull_request.draft == false
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true
      - name: Run pip-audit
        working-directory: fovux-mcp
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --no-install-project --no-build
          uv export --frozen --no-dev --no-editable --no-emit-project --no-hashes --output-file requirements-audit.txt
          uv run --frozen --no-build --no-sync pip-audit --requirement requirements-audit.txt --strict

  pnpm-audit:
    name: pnpm audit (fovux-studio)
    if: >
      github.repository == 'oaslananka/fovux-kit' &&
      (
        github.event_name != 'pull_request' ||
        github.event.pull_request.draft == false
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .nvmrc
      - name: Run pnpm audit
        working-directory: fovux-studio
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.34.1 --activate
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm audit --prod

  npm-wrapper-audit:
    name: npm audit (fovux-mcp wrapper)
    if: >
      github.repository == 'oaslananka/fovux-kit' &&
      (
        github.event_name != 'pull_request' ||
        github.event.pull_request.draft == false
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .nvmrc
      - name: Run npm wrapper audit
        working-directory: fovux-mcp-npm
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm audit --omit=dev

  osv-pr-scan:
    name: OSV pull-request dependency scan
    if: >
      github.repository == 'oaslananka/fovux-kit' &&
      (
        github.event_name == 'merge_group' ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.draft == false
        )
      )
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@9a498708959aeaef5ef730655706c5a1df1edbc2
    with:
      scan-args: |-
        --lockfile=fovux-mcp/uv.lock
        --lockfile=fovux-studio/pnpm-lock.yaml
        --lockfile=fovux-mcp-npm/package-lock.json
    permissions:
      actions: read
      contents: read
      security-events: write

  osv-full-scan:
    name: OSV full dependency scan
    if: >
      github.repository == 'oaslananka/fovux-kit' &&
      github.event_name != 'pull_request' &&
      github.event_name != 'merge_group'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2
    with:
      scan-args: |-
        --lockfile=fovux-mcp/uv.lock
        --lockfile=fovux-studio/pnpm-lock.yaml
        --lockfile=fovux-mcp-npm/package-lock.json
    permissions:
      actions: read
      contents: read
      security-events: write

  posture:
    name: Security posture check
    if: >
      github.repository == 'oaslananka/fovux-kit' &&
      (
        github.event_name != 'pull_request' ||
        github.event.pull_request.draft == false
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Run posture check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/generate_security_posture.py --strict

  security-required:
    name: security-required
    needs:
      [
        gitleaks,
        semgrep,
        trivy-fs,
        pip-audit,
        pnpm-audit,
        npm-wrapper-audit,
        osv-pr-scan,
        osv-full-scan,
        posture,
      ]
    if: always() && github.repository == 'oaslananka/fovux-kit'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Confirm security scans passed
        env:
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
          TRIVY_RESULT: ${{ needs.trivy-fs.result }}
          PIP_AUDIT_RESULT: ${{ needs.pip-audit.result }}
          PNPM_AUDIT_RESULT: ${{ needs.pnpm-audit.result }}
          NPM_WRAPPER_AUDIT_RESULT: ${{ needs.npm-wrapper-audit.result }}
          OSV_PR_RESULT: ${{ needs.osv-pr-scan.result }}
          OSV_FULL_RESULT: ${{ needs.osv-full-scan.result }}
          EVENT_NAME: ${{ github.event_name }}
          POSTURE_RESULT: ${{ needs.posture.result }}
        run: |
          set -euo pipefail
          for result in \
            "$GITLEAKS_RESULT" \
            "$SEMGREP_RESULT" \
            "$TRIVY_RESULT" \
            "$PIP_AUDIT_RESULT" \
            "$PNPM_AUDIT_RESULT" \
            "$NPM_WRAPPER_AUDIT_RESULT" \
            "$POSTURE_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "::error::At least one security scan did not pass."
              exit 1
            fi
          done

          if [[ "$EVENT_NAME" == "pull_request" || "$EVENT_NAME" == "merge_group" ]]; then
            if [[ "$OSV_PR_RESULT" != "success" || "$OSV_FULL_RESULT" != "skipped" ]]; then
              echo "::error::OSV pull-request scan routing failed."
              exit 1
            fi
          elif [[ "$OSV_PR_RESULT" != "skipped" || "$OSV_FULL_RESULT" != "success" ]]; then
            echo "::error::OSV full scan routing failed."
            exit 1
          fi

          echo "Security scans passed."
