name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:
    inputs:
      run_slow:
        description: "Run scheduled-style slow backend validation"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Required quality gate
    permissions:
      contents: read
      id-token: write
    if: >
      github.repository == 'oaslananka/fovux-kit' &&
      (
        github.event_name != 'pull_request' ||
        github.event.pull_request.draft == false
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Check action SHA pinning
        run: |
          if grep -R "^[[:space:]]*uses:" .github/workflows/ | grep -v "@[0-9a-f]\{40\}"; then
            echo "ERROR: Unpinned actions found. Use SHA-pinned refs."
            exit 1
          fi

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true
          cache-dependency-glob: fovux-mcp/uv.lock

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24.16.0"

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: "1.26.2"
          cache: false

      - name: Install quality tools
        run: |
          set -euo pipefail
          go install github.com/go-task/task/v3/cmd/task@v3.50.0
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          corepack enable
          corepack prepare pnpm@10.34.1 --activate
          pnpm --version

      - name: Resolve pnpm store path
        id: quality-pnpm-cache
        run: echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ steps.quality-pnpm-cache.outputs.store }}
          key: >-
            pnpm-${{ runner.os }}-node-24.16.0-
            ${{ hashFiles('fovux-studio/pnpm-lock.yaml', 'fovux-mcp-npm/package-lock.json') }}
          restore-keys: pnpm-${{ runner.os }}-node-24.16.0-

      - name: Run deterministic full quality gate
        id: quality-gate
        continue-on-error: true
        run: task ci

      - name: Upload backend coverage to Codecov
        if: ${{ !cancelled() && hashFiles('fovux-mcp/coverage.xml') != '' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          use_oidc: true
          files: fovux-mcp/coverage.xml
          flags: backend
          name: backend-coverage
          disable_search: true
          fail_ci_if_error: false

      - name: Upload Studio coverage to Codecov
        if: ${{ !cancelled() && hashFiles('fovux-studio/coverage/lcov.info') != '' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          use_oidc: true
          files: fovux-studio/coverage/lcov.info
          flags: studio
          name: studio-coverage
          disable_search: true
          fail_ci_if_error: false

      - name: Upload backend test results to Codecov
        if: ${{ !cancelled() && hashFiles('fovux-mcp/junit.xml') != '' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          use_oidc: true
          report_type: test_results
          files: fovux-mcp/junit.xml
          flags: backend
          name: backend-test-results
          disable_search: true
          fail_ci_if_error: false

      - name: Upload Studio test results to Codecov
        if: ${{ !cancelled() && hashFiles('fovux-studio/coverage/junit.xml') != '' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          use_oidc: true
          report_type: test_results
          files: fovux-studio/coverage/junit.xml
          flags: studio
          name: studio-test-results
          disable_search: true
          fail_ci_if_error: false

      - name: Confirm deterministic quality gate passed
        if: always()
        env:
          QUALITY_OUTCOME: ${{ steps.quality-gate.outcome }}
        run: |
          set -euo pipefail
          if [[ "$QUALITY_OUTCOME" != "success" ]]; then
            echo "::error::Deterministic quality gate result was $QUALITY_OUTCOME."
            exit 1
          fi

  compatibility:
    name: Compatibility (${{ matrix.os }}, Python ${{ matrix.python-version }})
    if: >
      github.repository == 'oaslananka/fovux-kit' &&
      (
        github.event_name != 'pull_request' ||
        github.event.pull_request.draft == false
      )
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
        python-version: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true
          cache-dependency-glob: fovux-mcp/uv.lock

      - name: Install backend compatibility environment from wheels
        if: matrix.os != 'macos-15' || matrix.python-version != '3.14'
        working-directory: fovux-mcp
        run: uv sync --frozen --extra dev --no-install-project --no-build

      - name: Install macOS Python 3.14 compatibility environment
        if: matrix.os == 'macos-15' && matrix.python-version == '3.14'
        working-directory: fovux-mcp
        # The locked Python 3.14 environment may need a third-party source build; the local
        # project remains blocked from running build hooks. This is the narrow reviewed exception.
        run: uv sync --frozen --extra dev --no-install-project --no-build-package fovux-mcp # NOSONAR

      - name: Run filesystem, process, and package smoke tests
        working-directory: fovux-mcp
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          uv run --no-sync --no-build python -c "import fovux; print(fovux.__version__)"
          uv run --no-sync --no-build pytest -q --no-header \
            tests/unit/test_config.py \
            tests/unit/test_path_helpers.py \
            tests/unit/test_path_policy.py \
            tests/unit/test_paths.py \
            tests/unit/test_processes.py \
            tests/unit/test_shutdown.py
          uv build --wheel --out-dir "$RUNNER_TEMP/fovux-wheel"

  compatibility-required:
    name: compatibility-required
    needs: [compatibility]
    if: always() && github.repository == 'oaslananka/fovux-kit'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Confirm platform compatibility passed
        env:
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
        run: |
          set -euo pipefail
          if [[ "$COMPATIBILITY_RESULT" != "success" ]]; then
            echo "::error::Compatibility matrix result was $COMPATIBILITY_RESULT."
            exit 1
          fi
          echo "Python and operating-system compatibility passed."

  node-compatibility:
    name: Node compatibility (${{ matrix.node-version }})
    if: >
      github.repository == 'oaslananka/fovux-kit' &&
      (
        github.event_name != 'pull_request' ||
        github.event.pull_request.draft == false
      )
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24.16.0"]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.34.1 --activate
          pnpm --version
      - name: Resolve pnpm store path
        id: node-pnpm-cache
        run: echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ steps.node-pnpm-cache.outputs.store }}
          key: >-
            pnpm-${{ runner.os }}-node-${{ matrix.node-version }}-
            ${{ hashFiles('fovux-studio/pnpm-lock.yaml', 'fovux-mcp-npm/package-lock.json') }}
          restore-keys: pnpm-${{ runner.os }}-node-${{ matrix.node-version }}-
      - name: Install Node workspaces
        run: |
          cd fovux-studio
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm rebuild esbuild
          cd ../fovux-mcp-npm
          npm ci --ignore-scripts
      - name: Typecheck and test Studio
        working-directory: fovux-studio
        run: |
          set -euo pipefail
          pnpm run typecheck
          pnpm test
      - name: Build Studio
        working-directory: fovux-studio
        run: pnpm run build
      - name: Validate npm wrapper package
        working-directory: fovux-mcp-npm
        run: |
          set -euo pipefail
          node --check bin/fovux-mcp.js
          npm pack --dry-run

  node-required:
    name: node-required
    needs: [node-compatibility]
    if: always() && github.repository == 'oaslananka/fovux-kit'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Confirm Node compatibility passed
        env:
          NODE_RESULT: ${{ needs.node-compatibility.result }}
        run: |
          set -euo pipefail
          if [[ "$NODE_RESULT" != "success" ]]; then
            echo "::error::Node compatibility result was $NODE_RESULT."
            exit 1
          fi
          echo "Studio and npm wrapper compatibility passed."

  slow-validation:
    name: Scheduled slow validation
    if: >
      github.repository == 'oaslananka/fovux-kit' &&
      (
        github.event_name == 'schedule' ||
        inputs.run_slow == 'true'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true
          cache-dependency-glob: fovux-mcp/uv.lock
      - name: Run slow and integration-marked backend tests
        working-directory: fovux-mcp
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --no-install-project --no-build
          PYTHONPATH=src uv run --no-sync --no-build pytest -q --no-header \
            -m "slow or integration or chaos or benchmark" \
            --basetemp="$RUNNER_TEMP/fovux-slow-pytest"

  renovate-config:
    name: Renovate policy
    if: >
      github.repository == 'oaslananka/fovux-kit' &&
      (
        github.event_name != 'pull_request' ||
        github.event.pull_request.draft == false
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Validate repository Renovate policy
        run: python scripts/validate_renovate_config.py

  ci-required:
    name: ci-required
    needs: [quality, compatibility-required, node-required, renovate-config]
    if: always() && github.repository == 'oaslananka/fovux-kit'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Confirm required CI lanes passed
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility-required.result }}
          NODE_RESULT: ${{ needs.node-required.result }}
          RENOVATE_CONFIG_RESULT: ${{ needs.renovate-config.result }}
        run: |
          set -euo pipefail
          for result in \
            "$QUALITY_RESULT" \
            "$COMPATIBILITY_RESULT" \
            "$NODE_RESULT" \
            "$RENOVATE_CONFIG_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "::error::At least one required CI lane did not pass."
              exit 1
            fi
          done
          echo "Required quality, compatibility, Node, and Renovate lanes passed."
