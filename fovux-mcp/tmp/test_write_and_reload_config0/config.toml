[fovux]
version = "1.0"
policy_mode = "developer"

[fovux.paths]
home = "~/.fovux"
runs = "runs"
models = "models"
cache = "cache"
exports = "exports"

[fovux.training]
default_device = "auto"
default_workers = 8
default_patience = 50

[fovux.inference]
default_conf = 0.25
default_iou = 0.45

[fovux.ui]
preferred_backend = "onnxruntime"

[fovux.telemetry]
enabled = false
endpoint = ""

[fovux.validation]
max_file_size_mb = 100
